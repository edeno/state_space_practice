[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "state_space_practice"
description = "State-space models in JAX: Kalman, point-process (Laplace-EKF), switching (SLDS) and coupled-oscillator models for neural data."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
keywords = [
    "state-space models",
    "kalman filter",
    "point process",
    "switching linear dynamical system",
    "neural decoding",
    "oscillators",
    "jax",
    "neuroscience",
]
authors = [{ name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Only what the package imports. Floors are the lowest versions in uv.lock (the
# Python 3.10 resolution), i.e. the oldest versions CI actually exercises.
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "jax>=0.6.2",
    "optax>=0.2.8",
    "patsy>=1.0.2",
    "networkx>=3.4.2",
    "scikit-learn>=1.7.2",
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/edeno/state_space_practice"
"Bug Tracker" = "https://github.com/edeno/state_space_practice/issues"

[project.optional-dependencies]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "hypothesis>=6.155",
    "ruff>=0.15.18",
    "mypy>=2.1",
    "matplotlib>=3.10.9",
]
coupling = ["polyagamma>=2.0.2"]
# All plotting helpers import matplotlib lazily, inside the plot functions.
plot = ["matplotlib>=3.10.9"]
# Extra packages used by the exploratory scripts in notebooks/ (not by the library).
notebooks = ["matplotlib>=3.10.9", "pandas>=2.3.3"]
# Graph place-field substrate (graph_place_field). neurospatial 0.8.0 is not on PyPI
# yet; uv resolves it from the pinned git source below. With pip, install
# neurospatial from GitHub first (see README).
spatial = ["neurospatial>=0.8.0"]
gpu = ["jax[cuda]"]
viz = ["sortingview"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/state_space_practice/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [".git_archival.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/state_space_practice"]
exclude = ["src/state_space_practice/tests"]

[tool.pytest.ini_options]
testpaths = ["src/state_space_practice/tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/state_space_practice"]
omit = ["*/tests/*", "*/_version.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["state_space_practice"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.uv.sources]
# neurospatial 0.8.0 (required by the `spatial` extra) is not yet on PyPI and the
# upstream repo has no v0.8.0 tag, so pin the commit on main whose pyproject declares
# version 0.8.0. Replace with a plain PyPI requirement once 0.8.0 is published.
neurospatial = { git = "https://github.com/edeno/neurospatial", rev = "e81dec62dbada29c70cfb3640488f429cae20608" }
