[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "state_space_practice"
description = "State-space models in JAX: Kalman, point-process (Laplace-EKF), switching (SLDS) and coupled-oscillator models for neural data."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
keywords = [
    "state-space models",
    "kalman filter",
    "point process",
    "switching linear dynamical system",
    "neural decoding",
    "oscillators",
    "jax",
    "neuroscience",
]
authors = [{ name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Only what the package imports. Floors are the lowest versions in uv.lock (the
# Python 3.10 resolution), i.e. the oldest versions CI actually exercises.
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "jax>=0.6.2",
    "optax>=0.2.8",
    "patsy>=1.0.2",
    "networkx>=3.4.2",
    "scikit-learn>=1.7.2",
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/edeno/state_space_practice"
"Bug Tracker" = "https://github.com/edeno/state_space_practice/issues"

[project.optional-dependencies]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "hypothesis>=6.155",
    "ruff>=0.15.18",
    "mypy>=2.1",
    "matplotlib>=3.10.9",
]
coupling = ["polyagamma>=2.0.2"]
# All plotting helpers import matplotlib lazily, inside the plot functions.
plot = ["matplotlib>=3.10.9"]
# Extra packages used by the exploratory scripts in notebooks/ (not by the library).
notebooks = ["matplotlib>=3.10.9", "pandas>=2.3.3"]
# Graph place-field substrate (graph_place_field). neurospatial 0.8.0 is not on PyPI
# yet; uv resolves it from the pinned git source below. With pip, install
# neurospatial from GitHub first (see README).
spatial = ["neurospatial>=0.8.0"]
gpu = ["jax[cuda]"]
viz = ["sortingview"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/state_space_practice/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [".git_archival.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/state_space_practice"]
exclude = ["src/state_space_practice/tests"]

[tool.pytest.ini_options]
testpaths = ["src/state_space_practice/tests"]
addopts = "-v --tb=short"
# Warnings are errors. Ignore only specific, known upstream deprecations here
# (none currently fire in the suite); the library's own deprecated
# models.stochastic_point_process_filter is silenced where tested.
filterwarnings = [
    "error",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/state_space_practice"]
omit = ["*/tests/*", "*/_version.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"
# Notebooks are kept output-free by nbstripout and not linted/formatted.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = [
    "E501", # line length is owned by `ruff format`; long strings/comments remain
]
# Exploratory scripts are formatted but not linted.
exclude = ["notebooks/**", "scripts/**"]
# TODO: enable "D" (pydocstyle, numpy convention). Currently ~1350 violations
# in src/, mostly D209/D401/D101; needs a dedicated docstring pass.

[tool.ruff.lint.per-file-ignores]
# zip(..., strict=True) would turn silent truncation into an error: a behaviour
# change to review per call site, not a mechanical fix.
"src/state_space_practice/{nonlinear_dynamics,place_field_model,preprocessing,smith_learning_algorithm}.py" = ["B905"]
"src/state_space_practice/simulate/simulate_switching_kalman.py" = ["B905", "NPY002"]
"src/state_space_practice/tests/**" = ["B905", "NPY002"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
# Modules that type-check cleanly today; CI runs plain `mypy` over exactly these.
# Add a module once its errors are fixed. `uv run mypy src/state_space_practice`
# checks everything (the remaining errors are tracked in the CHANGELOG).
files = [
    "src/state_space_practice/__init__.py",
    "src/state_space_practice/behavioral_uncertainty.py",
    "src/state_space_practice/circular_stats.py",
    "src/state_space_practice/coupling_ekf.py",
    "src/state_space_practice/coupling_pg.py",
    "src/state_space_practice/em_driver.py",
    "src/state_space_practice/exceptions.py",
    "src/state_space_practice/hamiltonian_core.py",
    "src/state_space_practice/hamiltonian_joint.py",
    "src/state_space_practice/hamiltonian_lfp.py",
    "src/state_space_practice/hamiltonian_spikes.py",
    "src/state_space_practice/hamiltonian_switching.py",
    "src/state_space_practice/models.py",
    "src/state_space_practice/nonlinear_dynamics.py",
    "src/state_space_practice/oscillator_models.py",
    "src/state_space_practice/oscillator_regularization.py",
    "src/state_space_practice/preprocessing.py",
    "src/state_space_practice/simulate/__init__.py",
    "src/state_space_practice/simulate/scenarios.py",
    "src/state_space_practice/simulate/simulate_switching_kalman.py",
    "src/state_space_practice/simulate/simulate_switching_spikes.py",
    "src/state_space_practice/simulate_coupling.py",
    "src/state_space_practice/simulate_data.py",
    "src/state_space_practice/temporal_rate_gp.py",
]
exclude = ["tests/"]
# Analyse imported modules for types but only report errors in `files`.
follow_imports = "silent"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.uv.sources]
# neurospatial 0.8.0 (required by the `spatial` extra) is not yet on PyPI and the
# upstream repo has no v0.8.0 tag, so pin the commit on main whose pyproject declares
# version 0.8.0. Replace with a plain PyPI requirement once 0.8.0 is published.
neurospatial = { git = "https://github.com/edeno/neurospatial", rev = "e81dec62dbada29c70cfb3640488f429cae20608" }
